name: Profile CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dart Sass
        run: npm install --global sass

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run repository checks
        run: ./scripts/lint.sh

      - name: Build stylesheet
        run: ./scripts/build.sh

      - name: Verify the committed stylesheet is up to date
        run: |
          if ! git diff --quiet -- profile/css/main.css; then
            echo "::error::profile/css/main.css is stale. Run ./scripts/build.sh and commit the result."
            git --no-pager diff --stat -- profile/css/main.css
            exit 1
          fi
          echo "Committed stylesheet matches the Sass sources."

      - name: Render the terminal profile
        run: ./scripts/profile.sh --no-color
