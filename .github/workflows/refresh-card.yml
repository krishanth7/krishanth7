name: Refresh profile card

# Regenerates the status card from live GitHub data so the figures on the
# profile stay current without anyone editing the README by hand.
on:
  schedule:
    # 06:17 UTC daily. An off-the-hour minute avoids the scheduling backlog
    # that builds up at :00, when most cron workflows fire.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-card
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate from live data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render the cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-card.sh

      - name: Commit if the figures changed
        run: |
          # stats.json records the render time, which changes on every run.
          # Only the rendered cards decide whether there is anything to commit.
          if git diff --quiet -- profile/card/card-matrix.svg profile/card/card-cyber.svg; then
            echo "No change in the rendered cards; leaving the repository alone."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/card/
          git commit -m "Refresh profile card from live GitHub data"
          git push
